[package]
name = "evophoto-cli"
description = "Headless EvoPhoto: convert, inspect, run commands, batch, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Open HEIC/HEIF photos (the optional evophoto-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["evophoto-codecs/heif"]

[lints]
workspace = true

[lib]
name = "evophoto_cli"
path = "src/lib.rs"

[[bin]]
name = "evophoto-cli"
path = "src/main.rs"

[dependencies]
evophoto-automation = { path = "../../crates/automation" }
evophoto-engine = { workspace = true }
evophoto-io = { workspace = true }
evophoto-format = { path = "../../crates/format" }
evophoto-codecs = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
# Synthetic camera raws (#7789).
evophoto-raw = { workspace = true, features = ["testgen"] }
# Shell completions and man pages (examples/man-and-completions.rs, for the packages); not in
# the binary.
clap_complete = { workspace = true }
clap_mangen = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for evophoto-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

