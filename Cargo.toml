[workspace]
exclude = ["vendor/evo-libs", "vendor/winprint"]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/evophoto", "apps/evophoto-cli", "xtask"]

[workspace.package]
version = "0.16.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
evo-ui = { path = "vendor/evo-libs/evo-ui", features = ["serde"] }
# internal
evophoto-geom = { path = "crates/geom" }
evophoto-color = { path = "crates/color" }
evophoto-cms = { path = "crates/cms" }
evophoto-raster = { path = "crates/raster" }
evophoto-doc = { path = "crates/doc" }
evophoto-ops = { path = "crates/ops" }
evophoto-psd = { path = "crates/psd" }
evophoto-codecs = { path = "crates/codecs" }
evophoto-raw = { path = "crates/raw" }
evophoto-affinity = { path = "crates/affinity" }
evophoto-compose = { path = "crates/compose" }
evophoto-gpu = { path = "crates/gpu" }
evophoto-paint = { path = "crates/paint" }
evophoto-algo = { path = "crates/algo" }
evophoto-io = { path = "crates/io" }
evophoto-text = { path = "crates/text" }
evophoto-vector = { path = "crates/vector" }
evophoto-format = { path = "crates/format" }
evophoto-automation = { path = "crates/automation" }
evophoto-plugins = { path = "crates/plugins" }
evophoto-engine = { path = "crates/engine" }
evophoto-ui-egui = { path = "crates/ui-egui" }
evophoto-testkit = { path = "crates/testkit" }
evophoto-tablet = { path = "crates/tablet" }
evophoto-ipp = { path = "crates/ipp" }

# external
evo-print = { path = "vendor/evo-libs/evo-print" }
evo-docpath = { path = "vendor/evo-libs/evo-docpath" }
evo-jpeg = { path = "vendor/evo-libs/evo-jpeg" }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4.6.11"
clap_mangen = { version = "0.3.3", features = ["env"] }
arc-swap = "1"
bytemuck = { version = "1", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false }
# Baseline-JPEG decode of lossy DNG tiles (compression 34892), shared with zune-jpeg.
zune-core = "0.5"
zune-jpeg = "0.5"
proptest = "1"
eframe = { version = "0.36", default-features = false }
# Without `default_fonts`, which embeds egui's fonts uncompressed: ui-egui ships them deflated
# (egui_fonts.rs; the web build's size gate).
egui = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rayon = "1"
criterion = { version = "0.5", default-features = false }
getrandom = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Dependencies carry no debug info: their frames in a backtrace lose file:line, and the target dir
# and link times shrink. The test profile inherits both settings.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
# Line tables keep file:line in panic backtraces but drop variable info, which roughly halves link
# time and PDB size for the test binaries (#2204). CI's Windows legs build with no debuginfo at all
# (CARGO_PROFILE_DEV_DEBUG=0). To inspect locals in a debugger, build with
# CARGO_PROFILE_DEV_DEBUG=true.
debug = "line-tables-only"

# Test builds compile ui-egui without optimization: its library and unit tests were the biggest
# test-build units after engine's (12.6 of ~63 compile minutes on the Windows CI runner), and its
# tests run no heavier pixel code of their own (that lives in the crates that stay optimized).
# Measured on CI: Windows build 18.9 -> 15.4 min, test run 10.0 -> 10.5. `cargo run` and
# `cargo build` use the dev profile and are unaffected.
[profile.test.package.evophoto-ui-egui]
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1

# The browser build (apps/evophoto-web, `data-cargo-profile` in its index.html). Hosts cap the
# size of a single file (Cloudflare Pages/Workers: 25 MiB), and the wasm is downloaded on every
# visit, so this profile optimizes for size: fat LTO, opt-level "z" for EvoPhoto's own crates,
# "s" for dependencies and for the crates that decode files, and 3 for pixel processing (filters
# and compositing). Dependencies stay at "s": at "z" the whole wasm grows (by 0.4 MB, measured).
# panic stays the target default (wasm32-unknown-unknown aborts; AGENTS.md's `panic = "unwind"`
# is for the native app shell). packaging/web/package.sh fails the build above 24 MiB.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.wasm-release.package."*"]
opt-level = "s"

# Decoding and rasterizing keep their speed.
[profile.wasm-release.package.evophoto-codecs]
opt-level = "s"
[profile.wasm-release.package.evophoto-raw]
opt-level = "s"
[profile.wasm-release.package.evophoto-heif]
opt-level = "s"
[profile.wasm-release.package.evophoto-vector]
opt-level = "s"

# Large crates off the per-frame and per-pixel paths: the document model, file parsers run once
# per open/save, JSON (settings, presets, control channel), SVG parsing, and shader translation
# (runs when a pipeline is created). "z" keeps the wasm well under the size gate.
[profile.wasm-release.package.evophoto-doc]
opt-level = "z"
[profile.wasm-release.package.evophoto-psd]
opt-level = "z"
[profile.wasm-release.package.evophoto-format]
opt-level = "z"
[profile.wasm-release.package.evophoto-affinity]
opt-level = "z"
[profile.wasm-release.package.serde_json]
opt-level = "z"
[profile.wasm-release.package.usvg]
opt-level = "z"
[profile.wasm-release.package.naga]
opt-level = "z"

# The browser UI toolkit favors size to stay within the WebAssembly upload budget.
[profile.wasm-release.package.egui]
opt-level = "z"
[profile.wasm-release.package.epaint]
opt-level = "z"
[profile.wasm-release.package.eframe]
opt-level = "z"

# Pixel processing keeps its speed-oriented optimization level, with two exceptions.
# Colour-management transforms are built once and cached (`transform::cached`), so "z" costs
# little runtime. The browser app composites per frame on the GPU (`crates/gpu`, WebGPU/WebGL2),
# so the CPU compositor is not the browser's hot path there; "z" for compose keeps the wasm
# under the 24 MiB gate (measured −122 KB vs opt-level 3). algo's filters run per pixel on
# every interactive filter application; "z" there is the size lever of last resort (−331 KB),
# taken because the gate is enforced in CI: if browser filters feel too slow, restore 3 here
# and reclaim the bytes from a feature-gated decoder instead.
[profile.wasm-release.package.evophoto-raster]
opt-level = 3
[profile.wasm-release.package.evophoto-color]
opt-level = 3
[profile.wasm-release.package.evophoto-cms]
opt-level = "z"
[profile.wasm-release.package.evophoto-compose]
opt-level = "z"
[profile.wasm-release.package.evophoto-algo]
opt-level = "z"
[profile.wasm-release.package.evophoto-paint]
opt-level = 3

