[package]
name = "evophoto-io"
description = "Import/export between evophoto documents and PSD/PSB and flat raster formats"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []
# HEIC/HEIF decode (forwarded to evophoto-codecs; see its `heif` feature).
heif = ["evophoto-codecs/heif"]

[dependencies]
evophoto-geom = { workspace = true }
evophoto-color = { workspace = true }
evophoto-cms = { workspace = true }
evophoto-raster = { workspace = true }
evophoto-doc = { workspace = true }
evophoto-compose = { workspace = true }
evophoto-algo = { workspace = true }
evophoto-psd = { workspace = true }
evophoto-codecs = { workspace = true }
evophoto-raw = { workspace = true }
evophoto-affinity = { workspace = true }
evophoto-text = { workspace = true }
evophoto-paint = { workspace = true }
evophoto-vector = { workspace = true }
evophoto-format = { path = "../format" }
evo-docpath = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
# svg.rs inflates `.svgz` itself (with a size cap) so the XML can be checked before it is parsed;
# pdn.rs inflates Paint.NET's gzip pixel chunks.
flate2 = { workspace = true }
# ora.rs reads OpenRaster's stack.xml (already in the tree through usvg).
roxmltree = "0.21"
# SVG import (svg.rs): usvg parses, resvg rasterises what the shape model can't hold. Both are
# already in the tree through the UI's icon loader; text shaping needs the fonts feature set.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "raster-images"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
resvg = { version = "0.45", default-features = false, features = ["text", "raster-images"] }

[dev-dependencies]
crc32fast = "1.5"
evophoto-affinity = { workspace = true, features = ["synth"] }
flate2 = { workspace = true }
evophoto-psd = { workspace = true, features = ["testgen"] }
evophoto-raw = { workspace = true, features = ["testgen"] }
evophoto-testkit = { workspace = true }
proptest = { workspace = true }
