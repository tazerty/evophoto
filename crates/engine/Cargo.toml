[package]
name = "evophoto-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []

[dependencies]
evophoto-geom = { workspace = true }
evophoto-color = { workspace = true }
evophoto-cms = { workspace = true }
evophoto-raster = { workspace = true }
evophoto-doc = { workspace = true }
evophoto-ops = { workspace = true }
evophoto-compose = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
evophoto-paint = { workspace = true }
evophoto-algo = { workspace = true }
evophoto-text = { workspace = true }
evophoto-vector = { workspace = true }
evophoto-io = { workspace = true }
evophoto-psd = { workspace = true }
evophoto-format = { workspace = true }
evophoto-plugins = { workspace = true }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
evophoto-codecs = { workspace = true }
flate2 = { workspace = true }
evo-print = { workspace = true }

# Photoshop `.kys` shortcut sets (`edit.keyboardShortcuts` `importKys`); already in the tree
# through evophoto-ui-egui and usvg.
roxmltree = "0.21"
# Release tags use the same semantic versions as Cargo.
semver = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"
chrono = { workspace = true }

# `file_cmds::same_file` on Windows: the volume serial number and file index, so a hard link to a
# file is that file (std's `MetadataExt::file_index` is unstable).
[target.'cfg(windows)'.dependencies]
same-file = "1"
# `file.print` loads Windows.Data.Pdf.dll before calling into it (#5884): the safe binding
# ui-egui and evo-print already use, pinned to the same version.
winsafe = { version = "=0.0.29", default-features = false, features = ["kernel"] }

# Printing on Unix: an IPP client for CUPS (pure Rust); the web build cannot print.
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
evophoto-ipp = { workspace = true }

[dev-dependencies]
evophoto-affinity = { workspace = true, features = ["synth"] }
# Synthetic camera raw files for the open tests.
evophoto-raw = { workspace = true, features = ["testgen"] }
evophoto-testkit = { workspace = true }
# WebAssembly text -> binary for plug-in test modules (Apache-2.0 WITH LLVM-exception).
wat = "1.228"
# Synthetic multi-part EXR fixtures for the parts-commands tests.
exr = { version = "1.73", default-features = false }
