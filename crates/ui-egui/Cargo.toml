[package]
name = "evophoto-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
evo-print = { workspace = true }
evo-ui = { workspace = true }
evophoto-geom = { workspace = true }
evophoto-color = { workspace = true }
evophoto-cms = { workspace = true }
evophoto-raster = { workspace = true }
evophoto-doc = { workspace = true }
evophoto-compose = { workspace = true }
evophoto-gpu = { workspace = true }
evophoto-engine = { workspace = true }
evophoto-io = { workspace = true }
evophoto-plugins = { workspace = true }
evophoto-algo = { workspace = true }
evophoto-text = { workspace = true }
evophoto-vector = { workspace = true }
# Only MAX_BRUSH_SIZE: `ui.set brushSize` validates against the Brush Settings range up front.
evophoto-paint = { workspace = true }
# Reading files to open them (bounded reads, a clear error for files larger than memory).
evophoto-format = { workspace = true }
# Decoding the brand mark's PNG (`brand.rs`); already linked through evophoto-io.
evophoto-codecs = { workspace = true }
egui = { workspace = true }
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { workspace = true, features = ["wgpu", "accesskit"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# Display order of right-to-left labels (`bidi_text.rs`); already linked through usvg.
unicode-bidi = "0.3"
base64 = "0.22"
# Inflating the translation catalogs, stored deflated (build.rs); already linked through evophoto-io.
flate2 = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }
# Safe native UI-language APIs (Windows/macOS); no subprocess or web dependency.
sys-locale = "=0.3.2"

# Installed RAM for the GPU memory budget (`gpu_canvas::physical_memory`): the safe binding the
# desktop app already uses, pinned to the same version.
[target.'cfg(target_os = "windows")'.dependencies]
winsafe = { version = "=0.0.29", default-features = false, features = ["kernel", "dxgi"] }

[dev-dependencies]
# egui's own default fonts in tests: the oracle for egui_fonts.rs, and contexts made with
# `Context::default()` (no install_fonts) can lay out text.
egui = { workspace = true, features = ["default_fonts"] }
# Synthetic raw files for the open-time Camera Raw dialog tests.
evophoto-raw = { workspace = true, features = ["testgen"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot", "eframe"] }
# Benchmark helpers for the `--json` benches `cargo xtask perf` runs (in-process RSS, percentiles).
evophoto-testkit = { workspace = true }
# examples/perf_scenarios.rs (a 500-brush .abr for the #210 import row) and large_file_bench.rs
# (the generated 2 GB PSD and 4.4 GB PSB of P20, `fixtures`).
evophoto-psd = { workspace = true, features = ["testgen"] }
# Isolated, self-cleaning folders for filesystem tests (the LUT folder, #6558).
tempfile = "3"

[build-dependencies]
# Deflates the translation catalogs and egui's default fonts (build.rs); already linked at run time to inflate them.
flate2 = { workspace = true }
# egui's default fonts, deflated by build.rs for egui_fonts.rs (the same version egui uses).
epaint_default_fonts = "0.36"
serde_json = { workspace = true }
toml = "1"
